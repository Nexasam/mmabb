name: Deploy to GoDaddy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, json, bcmath, sqlite3
        coverage: none
        
    - name: Install Composer dependencies
      run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
        
    - name: Install NPM dependencies
      run: npm ci
      
    - name: Build frontend
      run: npm run build
      env:
        APP_ENV: production
        NODE_ENV: production
        
    - name: Prepare deployment package
      run: |
        mkdir -p deploy
        rsync -av --exclude='node_modules' \
          --exclude='.git' \
          --exclude='.github' \
          --exclude='storage/framework/cache' \
          --exclude='storage/framework/sessions' \
          --exclude='storage/framework/views' \
          --exclude='storage/logs' \
          --exclude='tests' \
          --exclude='.env' \
          --exclude='.env.example' \
          --exclude='*.tar.gz' \
          ./ deploy/
          
    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H mmabconsultingandheathcare.com >> ~/.ssh/known_hosts
        
    - name: Deploy to server
      run: |
        rsync -avz \
          --exclude='storage/framework/cache' \
          --exclude='storage/framework/sessions' \
          --exclude='storage/framework/views' \
          --exclude='storage/logs' \
          --exclude='.env' \
          --exclude='database/database.sqlite' \
          deploy/ ${{ secrets.SSH_USER }}@mmabconsultingandheathcare.com:${{ secrets.DEPLOY_PATH }}/
          
    - name: Run post-deployment commands
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: mmabconsultingandheathcare.com
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd ${{ secrets.DEPLOY_PATH }}
          
          # Check if .env exists, if not copy from .env.production
          if [ ! -f .env ]; then
            echo "Creating .env from .env.production"
            cp .env.production .env
          fi
          
          # Ensure production settings are correct
          sed -i 's/APP_ENV=.*/APP_ENV=production/' .env
          sed -i 's/APP_DEBUG=.*/APP_DEBUG=false/' .env
          
          mkdir -p storage/framework/{sessions,views,cache}
          mkdir -p storage/logs
          chmod -R 775 storage bootstrap/cache
          php artisan config:clear
          php artisan view:clear
          php artisan route:clear
          php artisan cache:clear
          echo "Deployment completed at $(date)"
